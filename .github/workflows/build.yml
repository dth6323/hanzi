name: Deploy Web App (PWA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web-pwa:
    name: Build & Deploy iOS/Android Web App (PWA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: |
          mkdir -p assets/db
          touch assets/db/vi_full.db
          flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build Web PWA with bundled vi_full.db.gz
        working-directory: app
        run: |
          flutter build web --release --base-href "/hanzi/"
          cp ../vi_full.db.gz build/web/vi_full.db.gz

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/build/web
          force_orphan: true
